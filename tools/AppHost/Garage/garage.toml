# Local single-node Garage configuration for dxflrs/garage:v2.4.1.
# Secrets come from the GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN environment variables, never from this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
# Flush metadata to disk on each write so a container stop cannot lose acknowledged objects.
metadata_fsync = true
data_fsync = true

replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
